<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PIXEL QUEST — BROTEX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#304b76,#101a31 70%);color:#fff4d2;font-family:Vazirmatn,Tahoma,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
main{width:min(100%,1000px);padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.logo{font-weight:900;font-size:clamp(18px,4vw,27px);color:#ffdb79;text-shadow:3px 3px #8b4d42}.logo small{display:block;font-size:9px;color:#b6d3f6;letter-spacing:2px}.stats{display:flex;gap:6px}.stat{background:#203758;border:2px solid #6489b8;border-radius:9px;padding:5px 9px;font-size:12px}#frame{position:relative;border:4px solid #7197c1;border-radius:14px;overflow:hidden;box-shadow:0 9px 0 #091326,0 18px 40px #0008;background:#8bd1ed}canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.screen{position:absolute;inset:0;background:#101b35c9;display:flex;align-items:center;justify-content:center;padding:15px;text-align:center}.card{max-width:440px;background:#203758;border:3px solid #ffcf70;border-radius:15px;padding:20px;box-shadow:7px 7px #0a1428}.card h1{margin:0;color:#ffdc83;font-size:clamp(24px,5vw,36px);text-shadow:3px 3px #95534a}.card p{font-size:13px;line-height:1.9;color:#e2edff}.btn{border:0;border-radius:10px;background:#ffca55;color:#26344d;font:900 16px Vazirmatn;padding:10px 25px;box-shadow:0 5px #b77735}.btn:active{transform:translateY(3px);box-shadow:0 2px #b77735}.hint{font-size:10px!important;color:#b6d0ef!important}footer{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;gap:12px}.pad{display:flex;gap:8px;direction:ltr}.ctrl{width:58px;height:52px;border-radius:12px;border:2px solid #7298c3;background:#29486e;color:white;font-size:22px;font-weight:bold;box-shadow:0 5px #0c1830;touch-action:none}.ctrl:active{transform:translateY(3px);background:#416b9e;box-shadow:0 2px #0c1830}.jump{width:82px;background:#a34e62;border-color:#e69aa3;font-size:14px}.note{font-size:11px;color:#b9cde8;line-height:1.8}@media(max-width:560px){main{padding:7px}.stat{font-size:10px;padding:4px 6px}.ctrl{width:54px;height:49px}.note{display:none}footer{justify-content:center}}
</style></head>
<body><main>
<header><div class="logo">PIXEL QUEST<small>BROTEX • 8-BIT PLATFORMER</small></div><div class="stats"><div class="stat">🪙 <b id="score">۰</b></div><div class="stat">❤️ <b id="life">۳</b></div><div class="stat">🏁 ۱</div></div></header>
<div id="frame"><canvas id="c" width="960" height="540"></canvas>
<div class="screen" id="intro"><div class="card"><h1>ماجراجویی پیکسلی</h1><p>سکه‌ها را جمع کن، از روی هیولاها بپر و خودت را به پرچم پایان برسان!</p><button class="btn" id="start">شروع بازی</button><p class="hint">حرکت: ← → یا A و D | پرش: Space</p></div></div>
<div class="screen" id="finish" style="display:none"><div class="card"><h1 id="resultTitle">آفرین!</h1><p id="resultText"></p><button class="btn" id="restart">بازی دوباره</button></div></div></div>
<footer><div class="pad"><button class="ctrl" data-k="left">◀</button><button class="ctrl" data-k="right">▶</button><button class="ctrl jump" data-k="jump">پرش ⤒</button></div><div class="note">با دکمه‌ها در موبایل بازی کن<br>روی دشمن‌ها بپر تا شکست بخورند!</div></footer>
</main>
<script>
(()=>{const cv=document.querySelector('#c'),g=cv.getContext('2d'),W=960,H=540,world=3200,fa=n=>(''+n).replace(/\\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),$=id=>document.getElementById(id);
let p,plats,coins,bads,cam=0,score=0,lives=3,keys={left:false,right:false,jump:false},state='menu',tick=0,flag=3150;
function init(){p={x:50,y:390,w:30,h:39,vx:0,vy:0,on:false,inv:0,face:1};plats=[[0,478,620],[700,478,480],[1240,478,500],[1810,478,470],[2350,478,850],[190,390,120],[390,330,120],[550,390,90],[800,390,120],[1000,330,120],[1300,390,120],[1510,330,120],[1680,390,100],[1900,390,120],[2110,330,120],[2320,390,100],[2500,350,120],[2740,390,120],[2940,330,120]];coins=[];[[220,350],[260,350],[430,290],[470,290],[580,350],[850,350],[900,350],[1040,290],[1080,290],[1350,350],[1390,350],[1550,290],[1720,350],[1950,350],[2150,290],[2360,350],[2540,310],[2790,350],[2980,290],[3060,430]].forEach(([x,y])=>coins.push({x,y,t:false}));bads=[[470,1],[920,-1],[1430,1],[2010,-1],[2600,1],[2850,-1]].map(([x,d])=>({x,base:x,d,alive:true,y:450}));cam=0;score=0;lives=3;$('score').textContent='۰';$('life').textContent='۳';state='play';$('intro').style.display='none';$('finish').style.display='none'}
function box(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function draw(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#68b8e5');sky.addColorStop(1,'#d9f2d4');g.fillStyle=sky;g.fillRect(0,0,W,H);
for(let i=0;i<8;i++){let x=((i*190-cam*.2)%1250+1250)%1250-100;box(x,280,145,210,'#7db7a6');box(x+30,250,80,30,'#7db7a6')}
for(let i=0;i<7;i++){let x=((i*210-cam*.32)%1150+1150)%1150-100,y=65+i%3*45;box(x,y,65,18,'#f4fff0');box(x+15,y-12,32,15,'#f4fff0')}
plats.forEach(([x,y,w])=>{x-=cam;if(x+w<0||x>W)return;box(x,y,w,65,'#8c563b');box(x,y,w,9,'#55ad59');for(let xx=0;xx<w;xx+=28){box(x+xx,y+18,14,12,'#ad7048');box(x+xx+14,y+34,14,12,'#75442f')}});
coins.forEach(c=>{if(c.t)return;let x=c.x-cam,y=c.y+Math.sin(tick*.09+c.x)*3;box(x-6,y-9,12,18,'#f4a51e');box(x-3,y-6,6,12,'#ffe783')});
bads.forEach(e=>{if(!e.alive)return;let x=e.x-cam;box(x,e.y+6,30,22,'#9a4962');box(x+4,e.y,22,13,'#c66a73');box(x+6,e.y+10,5,6,'white');box(x+19,e.y+10,5,6,'white');box(x+8,e.y+12,2,3,'#17223b');box(x+21,e.y+12,2,3,'#17223b')});
let fx=flag-cam;box(fx,382,7,95,'#f7e5a8');box(fx+7,386,48,30,'#e75b68');box(fx+7,402,48,14,'#fff0c7');box(fx-12,472,40,8,'#80523b');
let x=p.x-cam,y=p.y;if(!(p.inv>0&&tick%8<4)){box(x+6,y,19,8,'#263a66');box(x+3,y+6,24,9,'#f0b47c');box(x+7,y+10,4,4,'white');box(x+20,y+10,4,4,'white');box(x+5,y+16,22,16,'#3d83ce');box(x,y+18,7,13,'#f0b47c');box(x+25,y+18,7,13,'#f0b47c');box(x+7,y+31,8,8,'#39436b');box(x+19,y+31,8,8,'#39436b')}
box(18,17,160,9,'#274467');box(18,17,160*p.x/world,9,'#ffe07b');g.fillStyle='#18324d';g.font='bold 13px Vazirmatn';g.textAlign='left';g.fillText('PIXEL QUEST',28,40)}
function end(win){state=win?'win':'dead';$('resultTitle').textContent=win?'مرحله کامل شد! 🎉':'بازی تمام شد';$('resultText').textContent=win?'عالی بود! '+fa(score)+' سکه و امتیاز جمع کردی.':'دوباره تلاش کن و به پرچم برس!';$('finish').style.display='flex'}
function hurt(){if(p.inv)return;lives--;$('life').textContent=fa(lives);p.inv=90;p.vy=-7;p.vx=-p.face*3;if(lives<=0)end(false)}
function update(){if(state!=='play')return;tick++;if(keys.left){p.vx-=.62;p.face=-1}if(keys.right){p.vx+=.62;p.face=1}if(!keys.left&&!keys.right)p.vx*=.78;p.vx=Math.max(-4.8,Math.min(4.8,p.vx));if(keys.jump&&p.on){p.vy=-11.5;p.on=false}keys.jump=false;p.x=Math.max(0,Math.min(world-p.w,p.x+p.vx));let old=p.y;p.vy=Math.min(13,p.vy+.52);p.y+=p.vy;p.on=false;plats.forEach(([x,y,w])=>{if(p.x+p.w>x&&p.x<x+w&&old+p.h<=y+5&&p.y+p.h>=y&&p.vy>=0){p.y=y-p.h;p.vy=0;p.on=true}});if(p.y>H+80){hurt();p.y=300}if(p.inv)p.inv--;coins.forEach(c=>{if(!c.t&&hit(p,{x:c.x-9,y:c.y-9,w:18,h:18})){c.t=true;score++;$('score').textContent=fa(score)}});bads.forEach(e=>{if(!e.alive)return;e.x+=e.d;if(Math.abs(e.x-e.base)>65)e.d*=-1;if(hit(p,{x:e.x,y:e.y,w:30,h:28})){if(p.vy>1&&p.y+p.h-e.y<17){e.alive=false;p.vy=-8;score+=2;$('score').textContent=fa(score)}else hurt()}});if(p.x>flag-20)end(true);cam=Math.max(0,Math.min(world-W,p.x-W*.38))}
function loop(){update();draw();requestAnimationFrame(loop)}
$('start').onclick=init;$('restart').onclick=init;window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','A','D','w','W'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if([' ','ArrowUp','w','W'].includes(e.key))keys.jump=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;const down=e=>{e.preventDefault();if(k==='jump')keys.jump=true;else keys[k]=true;b.setPointerCapture?.(e.pointerId)};const up=e=>{e.preventDefault();if(k!=='jump')keys[k]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
draw();loop()})();
</script></body></html>
